/* ⓘ Règles / Comment jouer : contenu défilable */
#rulesInfoModal{
  align-items:flex-start;
  overflow-y:auto;
}
#rulesInfoModal .modal-box{
  max-height:calc(100vh - 40px);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
#rulesInfoModal #roundInfoContent{
  overflow-y:auto;
  flex:1 1 auto;
  min-height:0;
  padding-right:8px;
  -webkit-overflow-scrolling:touch;
}
#rulesInfoModal #roundInfoContent::-webkit-scrollbar{
  width:8px;
}

/* ===== Canasta — visual refresh / logo only ===== */
:root{
  --cream:#fbf6eb;
  --paper:#fffdf8;
  --ink:#332d28;
  --muted:#786f67;
  --red:#a52f36;
  --red-soft:#f7e4e2;
  --gold:#c7973e;
  --gold-soft:#f6ecd5;
  --line:#eadfce;
  --shadow:0 12px 32px rgba(74,55,35,.10);
  --shadow-soft:0 5px 18px rgba(74,55,35,.08);
}

body{
  background:
    radial-gradient(circle at 15% 10%, rgba(199,151,62,.10), transparent 28%),
    radial-gradient(circle at 90% 0%, rgba(165,47,54,.08), transparent 30%),
    linear-gradient(180deg,#fffaf1 0%,var(--cream) 100%);
  color:var(--ink);
}

.card{
  background:rgba(255,253,248,.94);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow-soft);
  backdrop-filter:blur(6px);
}
.card:hover{box-shadow:var(--shadow)}

button{
  border-radius:14px;
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}

input,select{
  border-radius:12px;
  border:1px solid #dfd2c1;
  background:#fffefa;
}
input:focus,select:focus{
  outline:none;
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(199,151,62,.14);
}

.section-title{
  color:var(--red);
  letter-spacing:.2px;
}
h2,h3{letter-spacing:-.3px}
hr{border:0;border-top:1px solid var(--line)}

.info{
  background:linear-gradient(135deg,#fffdf8,#fbf5e9);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 14px;
  line-height:1.55;
}
.modal-box{
  border-radius:24px;
  border:1px solid var(--line);
  box-shadow:0 22px 60px rgba(52,38,25,.20);
}

/* ===== Logo Canasta — cartes/dominos stylisés ===== */
header{
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:18px;
  min-height:118px;
  position:relative;
}
header > .actions{
  display:flex;
  position:absolute;
  right:0;
  top:8px;
  z-index:10;
}
header > div:not(.brand-mark):not(.actions){display:none}
header > .actions{display:flex;position:absolute;right:0;top:8px;z-index:10}
header > .brand-mark{
  width:min(100%,720px);
  height:108px;
  margin:0 auto;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Le texte historique reste masqué, mais les boutons d'action restent accessibles. */
header > div:not(.brand-mark):not(.actions){display:none}
header > .actions{display:flex}

.brand-mark .brand-card,
.brand-mark .brand-domino{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#fffefa,#f4ede3);
  border:1px solid #d8cbbb;
  box-shadow:0 10px 20px rgba(54,39,25,.18), inset 0 1px 0 #fff;
}

/* Dominos verticaux : vrais pips, pas de chiffres */
.brand-mark .brand-card{
  width:48px;
  height:70px;
  top:13px;
  border-radius:10px;
  transform-origin:center bottom;
}

/* Le Joker reste au centre, légèrement plus grand */
.brand-mark .brand-card:nth-child(3){
  width:53px;
  height:74px;
  top:9px;
  border-radius:11px;
  font-size:29px;
  z-index:5;
  transform:translateY(-2px) rotate(0deg);
}

/* 1 jaune */
.brand-mark .brand-card:nth-child(1){
  transform:rotate(-15deg) translateX(-132px);
  color:#d1a321;
}
.brand-mark .brand-card:nth-child(1)::after{
  content:"";
  width:12px;
  height:12px;
  border-radius:50%;
  background:#d1a321;
  box-shadow:0 1px 2px rgba(0,0,0,.18);
}

/* 7 rouge */
.brand-mark .brand-card:nth-child(2){
  transform:rotate(-7deg) translateX(-78px);
  color:#b52d3a;
  font-size:0;
}
.brand-mark .brand-card:nth-child(2)::after{
  content:"";
  width:100%;
  height:100%;
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 15%,#b52d3a 0 5px,transparent 5.5px),
    radial-gradient(circle at 25% 30%,#b52d3a 0 5px,transparent 5.5px),
    radial-gradient(circle at 75% 30%,#b52d3a 0 5px,transparent 5.5px),
    radial-gradient(circle at 50% 50%,#b52d3a 0 5px,transparent 5.5px),
    radial-gradient(circle at 25% 70%,#b52d3a 0 5px,transparent 5.5px),
    radial-gradient(circle at 75% 70%,#b52d3a 0 5px,transparent 5.5px),
    radial-gradient(circle at 50% 85%,#b52d3a 0 5px,transparent 5.5px);
}

/* 3 noir */
.brand-mark .brand-card:nth-child(4){
  transform:rotate(8deg) translateX(78px);
  color:#272421;
  font-size:0;
}
.brand-mark .brand-card:nth-child(4)::after{
  content:"";
  width:100%;
  height:100%;
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 20%,#272421 0 5px,transparent 5.5px),
    radial-gradient(circle at 50% 50%,#272421 0 5px,transparent 5.5px),
    radial-gradient(circle at 50% 80%,#272421 0 5px,transparent 5.5px);
}

/* Domino 2 à droite */
.brand-mark .brand-domino{
  width:48px;
  height:65px;
  top:17px;
  transform:rotate(16deg) translateX(130px);
  border-radius:9px;
  color:#b52d3a;
  font-size:0;
  z-index:3;
}
.brand-mark .brand-domino::after{
  content:"";
  width:100%;
  height:100%;
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 25%,#b52d3a 0 5px,transparent 5.5px),
    radial-gradient(circle at 50% 75%,#b52d3a 0 5px,transparent 5.5px);
}

/* Séparation graphique discrète dans les dominos */
.brand-mark .brand-card:nth-child(1)::before,
.brand-mark .brand-card:nth-child(2)::before,
.brand-mark .brand-card:nth-child(4)::before,
.brand-mark .brand-domino::before{
  content:"";
  position:absolute;
  left:9px;
  right:9px;
  top:50%;
  height:1px;
  background:#e3d7c8;
  z-index:2;
}

/* Le Joker masque sa séparation */
.brand-mark .brand-card:nth-child(3)::before{display:none}

/* Wordmark stylisé intégré au logo */
.brand-mark::after{
  content:"Canasta";
  position:absolute;
  left:calc(50% + 155px);
  top:50%;
  transform:translateY(-53%);
  font-family:Georgia,"Times New Roman",serif;
  font-size:39px;
  line-height:1;
  font-weight:900;
  font-style:italic;
  letter-spacing:-2px;
  color:#a52f36;
  text-shadow:0 2px 0 #fff,0 6px 16px rgba(165,47,54,.14);
  white-space:nowrap;
}
.brand-mark::before{
  content:none;
}

#home .hero{padding-top:28px}
#home .hero h1{display:none}
#home .hero p{margin-top:0}

@media (max-width:720px){
  header{
    min-height:92px;
  }
  header > .brand-mark{
    height:82px;
    width:100%;
  }
  .brand-mark .brand-card{
    width:39px;
    height:55px;
    top:12px;
    font-size:20px;
  }
  .brand-mark .brand-card:nth-child(1){transform:rotate(-17deg) translateX(-91px)}
  .brand-mark .brand-card:nth-child(2){transform:rotate(-8deg) translateX(-56px)}
  .brand-mark .brand-card:nth-child(3){font-size:23px}
  .brand-mark .brand-card:nth-child(4){transform:rotate(8deg) translateX(56px)}
  .brand-mark .brand-domino{
    width:37px;
    height:50px;
    top:15px;
    transform:rotate(16deg) translateX(91px);
    font-size:18px;
  }
  .brand-mark::after{
    left:calc(50% + 107px);
    top:29px;
    font-size:24px;
    letter-spacing:-1px;
  }
  .brand-mark::before{
    left:calc(50% + 195px);
    top:27px;
    font-size:13px;
  }
}


/* ===== Accueil : bouton toujours visible hors accueil ===== */
header > .actions{
  display:flex !important;
  position:absolute;
  right:0;
  top:8px;
  z-index:50;
}
#homeBtn:not(.hidden),
#rulesBtn:not(.hidden){
  display:inline-flex !important;
  align-items:center;
  justify-content:center;
}


/* ===== Bouton Accueil : visibilité forcée ===== */
#homeBtn{
  display:inline-flex !important;
  align-items:center;
  justify-content:center;
  background:#f1e9df;
  color:#332d28;
  border:1px solid #dfd2c1;
  min-height:40px;
  padding:9px 14px;
  font-weight:800;
}
#homeBtn.hidden{display:inline-flex !important;}


/* Joueur qui ferme : son pavé de cartes disparaît après sélection */
.player-round.hidden{display:none!important}


/* Proposition UX/UI : cartes compactes sur deux lignes */
.card-count-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.card-count-grid .counter{display:grid;grid-template-columns:minmax(0,1fr) 25px 28px 25px;grid-template-areas:"label minus count plus";gap:4px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 7px;box-shadow:0 3px 10px #4b32120a}
.card-count-grid .ctext{grid-area:label;font-weight:800;font-size:13px;line-height:1.2}
.card-count-grid .counter>.mini:first-of-type{grid-area:minus}
.card-count-grid .counter>.count{grid-area:count}
.card-count-grid .counter>.mini:last-of-type{grid-area:plus}
.card-count-grid .pts{display:none}
.card-count-grid .mini{width:25px;height:30px;border-radius:8px;padding:0}
.card-count-grid .count{font-size:14px}
@media(max-width:1050px){.card-count-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.card-count-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style><style>
.canasta-choice{margin-bottom:12px}
.canasta-choice .closer{margin-top:6px}

/* Mise en page du calcul d'une manche : deux colonnes équilibrées */
.calc-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:12px}
.calc-column{min-width:0;overflow-wrap:anywhere}
.calc-column .section-title{margin-top:0!important}
.calc-columns .counter{grid-template-columns:minmax(0,1fr) 28px 34px 28px 54px;gap:5px}
@media(max-width:720px){.calc-columns{grid-template-columns:1fr;gap:12px}.calc-columns .counter{grid-template-columns:1fr 36px 40px 36px 55px}}

<style>

.calc-column .ctext{min-width:0;overflow-wrap:normal;word-break:normal;}

function ensureCanastaCustomRules(){
  state.rules=state.rules||{};
  if(state.rules.canasta3==null)state.rules.canasta3=3000;
  if(state.rules.canastaValues==null)state.rules.canastaValues=2000;
  Object.keys(state.rules).forEach(k=>{
    if(["canasta3","canastaValues","canastaNormal","canastaAce","canastaWildNormal","canastaWildAce","red3","turned","close"].includes(k))return;
    let n=String(k).toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g,"");
    if(n==="canasta de 3"||n==="canasta de valeurs"||n==="canasta de valori")delete state.rules[k];
  });
}
function customRules(){
  ensureCanastaCustomRules();
  let base=new Set(["canastaNormal","canastaAce","canastaWildNormal","canastaWildAce","red3","turned","close","canasta3","canastaValues"]);
  return Object.keys(state.rules||{}).filter(k=>!base.has(k)).map(k=>({key:k,label:k,pts:Number(state.rules[k])||0,can:/canasta/i.test(k)}));
}
function customRuleScore(r){return customRules().reduce((sum,x)=>sum+(r?.[x.key]||0)*x.pts,0)}
function hasCanasta(r){return (r?.canastaNormal||0)+(r?.canastaAce||0)+(r?.canastaWildNormal||0)+(r?.canastaWildAce||0)+(r?.canasta3||0)+(r?.canastaValues||0)+customRules().filter(x=>x.can).reduce((n,x)=>n+(r?.[x.key]||0),0)>0}
function liveScore(r){
  r=r||{};let can=hasCanasta(r);
  let canastaPoints=(r.canastaNormal||0)*state.rules.canastaNormal+(r.canastaAce||0)*state.rules.canastaAce+
  (r.canastaWildNormal||0)*state.rules.canastaWildNormal+(r.canastaWildAce||0)*state.rules.canastaWildAce+
  (r.canasta3||0)*state.rules.canasta3+(r.canastaValues||0)*state.rules.canastaValues+customRuleScore(r);
  let laid=(r.laid46||0)*5+(r.laid7k||0)*10+(r.laidAce||0)*25+(r.laid2||0)*20+(r.laidJoker||0)*50+(r.laid3||0)*state.rules.red3;
  let hand=(r.hand46||0)*5+(r.hand7k||0)*10+(r.handAce||0)*25+(r.hand2||0)*20+(r.handJoker||0)*50+(r.hand3||0)*100;
  let negative=(r.neg46||0)*5+(r.neg7k||0)*10+(r.negAce||0)*25+(r.neg2||0)*20+(r.negJoker||0)*50+(r.neg3||0)*100;
  let s=(can?canastaPoints+laid-hand:-negative)+(r.free||0);
  return{can,s}
}
function refreshLive(){
  let panels=[...document.querySelectorAll("#roundPlayersInputs .player-round")];
  panels.forEach(panel=>{
    let i=Number(panel.dataset.player),p=state.players[i];
    if(!p)return;
    let lv=liveScore(p.round),c=panel.querySelector(".live-check"),t=panel.querySelector(".live-total");
    if(c){
      c.className="live-check "+(lv.can?"ok":"bad");
      if(c.lastElementChild)c.lastElementChild.textContent=lv.can?"✓ OK":"✕ "+(mode==="FR"?"Aucune":"Nicio");
    }
    if(t){
      t.className="live-total "+(lv.s>=0?"ok":"bad");
      if(t.lastElementChild)t.lastElementChild.textContent=(lv.s>=0?"+":"")+fmt(lv.s);
    }
  });
}
function playerRows(p,i,isCloser=false){
  let r=p.round||{},fr=mode==="FR",confirmed=isCloser||r.canastaConfirmed===true;
  let lv=liveScore(r);
  let choice=isCloser?`<div class="info">🏆 ${fr?"Joueur ayant fermé : Canasta obligatoire.":"Jucătorul care a închis trebuie să aibă Canastă."}</div>`:`<div class="canasta-choice"><div class="section-title">🏆 ${fr?"Canasta ?":"Canastă ?"}</div><div class="closer"><button type="button" class="${r.canastaConfirmed===true?"active":""}" data-canasta="yes" data-i="${i}">✅ ${fr?"Oui":"Da"}</button><button type="button" class="${r.canastaConfirmed===false?"active":""}" data-canasta="no" data-i="${i}">❌ ${fr?"Non":"Nu"}</button></div></div>`;
  // Tant que le joueur restant n'a pas répondu Oui/Non, n'afficher aucun scoring.
  if(!isCloser && r.canastaConfirmed!==true && r.canastaConfirmed!==false)return choice;
  let left="",right="";
  if(confirmed){
    left+=`<div class="section-title">🏆 ${fr?"CANASTAS":"CANASTE"}</div>`;
    left+=C("canastaNormal",fr?"Canasta 4 → Roi":"Canasta 4 → Rege",state.rules.canastaNormal,r.canastaNormal||0,i);
    left+=C("canastaAce",fr?"Canasta d’As":"Canasta de Ași",state.rules.canastaAce,r.canastaAce||0,i);
    left+=C("canasta3",T().can3,state.rules.canasta3,r.canasta3||0,i);
    right+=`<div class="section-title">🃏 ${fr?"CANASTAS VALEURS":"CANASTE DE VALORI"}</div>`;
    right+=C("canastaWildNormal",fr?"4 → Roi":"4 → Rege",state.rules.canastaWildNormal,r.canastaWildNormal||0,i);
    right+=C("canastaWildAce",fr?"As":"Ași",state.rules.canastaWildAce,r.canastaWildAce||0,i);
    right+=C("canastaValues",T().canValues,state.rules.canastaValues,r.canastaValues||0,i);
    left+=`<div class="section-title laid-section-title">🃏 ${fr?"CARTES POSÉES HORS CANASTA":"CĂRȚI PUSE JOS FĂRĂ CANASTĂ"}</div>`;
    left+=cardGrid([["laid46",fr?"4 à 6":"4 – 6",5,r.laid46], ["laid7k",fr?"7 à Roi":"7 – Rege",10,r.laid7k], ["laidAce",fr?"As":"Ași",25,r.laidAce], ["laid2","2",20,r.laid2], ["laidJoker","Joker",50,r.laidJoker], ["laid3",fr?"3":"3",100,r.laid3]],i);
    if(!isCloser){
      right+=`<div class="section-title hand-section-title">🖐️ ${fr?"CARTES ENCORE EN MAIN":"CĂRȚI RĂMASE ÎN MÂNĂ"}</div>`;
      right+=cardGrid([["hand46",fr?"4 à 6":"4 – 6",-5,r.hand46], ["hand7k",fr?"7 à Roi":"7 – Rege",-10,r.hand7k], ["handAce",fr?"As":"Ași",-25,r.handAce], ["hand2","2",-20,r.hand2], ["handJoker","Joker",-50,r.handJoker], ["hand3","3",-100,r.hand3]],i);
    }
    let otherCustom=customRules().filter(x=>!x.can);
    if(otherCustom.length){right+=`<div class="section-title">✨ ${fr?"RÈGLES PERSONNALISÉES":"REGULI PERSONALIZATE"}</div>`;otherCustom.forEach(x=>right+=C(x.key,x.label,x.pts,r[x.key]||0,i));}
  }else{
    left+=`<div class="section-title">❌ ${fr?"CARTES NÉGATIVES":"CĂRȚI NEGATIVE"}</div><div class="info">${fr?"Toutes les cartes sont négatives puisque le joueur n’a pas de Canasta.":"Toate cărțile sunt negative deoarece jucătorul nu are Canastă."}</div>`;
    right="";
    left+=cardGrid([["neg46",fr?"4 à 6":"4 – 6",-5,r.neg46], ["neg7k",fr?"7 à Roi":"7 – Rege",-10,r.neg7k], ["negAce",fr?"As":"Ași",-25,r.negAce], ["neg2","2",-20,r.neg2], ["negJoker","Joker",-50,r.negJoker], ["neg3",fr?"3":"3",-100,r.neg3]],i);
  }
  return choice+`<div class="calc-columns${right?"":" single-column"}"><div class="calc-column">${left}</div>${right?`<div class="calc-column">${right}</div>`:""}</div><div class="live-total ${lv.s>=0?"ok":"bad"}"><span>${fr?"Total provisoire":"Total provizoriu"}</span><span>${lv.s>=0?"+":""}${fmt(lv.s)}</span></div><div class="section-title free-title">➕ ${T().free}</div><div class="free"><input type="number" step="1" data-free="${i}" value="${r.free||0}"><span class="sub">${T().freeHelp}</span></div><div class="quick-points" aria-label="Points rapides">${[20,50,100,300,500].map(v=>{let sign=confirmed?1:-1;return `<button type="button" data-quick="${sign*v}" data-i="${i}">${sign>0?"+":"−"}${v}</button>`;}).join("")}</div>`;
}

function renderCurrentRoundPlayer(){
  let ordered=[state.players.find(p=>p.id===state.closer),...state.players.filter(p=>p.id!==state.closer)].filter(Boolean);
  let idx=state.roundPlayerIndex||0,p=ordered[idx];
  if(!p){$("roundPlayersInputs").innerHTML=`<div class="info">${mode==="FR"?"Tous les joueurs ont été saisis.":"Toți jucătorii au fost completați."}</div>`;return;}
  let i=state.players.indexOf(p),isCloser=i===state.closer;
  const stepTitle=$('roundStep2').querySelector('.section-title');
  if(stepTitle) stepTitle.textContent=`2️⃣ ${isCloser?(mode==="FR"?"Points du joueur ayant fermé":"Punctele jucătorului care a închis"):(mode==="FR"?"Canasta des joueurs restants":"Canasta jucătorilor rămași")}`;
  const nextLabel=mode==="FR"?"Joueur suivant →":"Jucătorul următor →";
  const nextButton=idx<ordered.length-1?`<button type="button" class="primary next-player" id="nextPlayerBtn">${nextLabel}</button>`:"";
  $("roundPlayersInputs").innerHTML=`<div class="player-round" data-player="${i}"><h3>${esc(p.name)}${isCloser?" 🏆":""}</h3>${playerRows(p,i,isCloser)}${nextButton}</div>`;
  if(idx<ordered.length-1) $("nextPlayerBtn").onclick=()=>{
    if(!isCloser && typeof (p.round||{}).canastaConfirmed!=="boolean")return alert(mode==="FR"?"Choisis Canasta : Oui ou Non.":"Alege Canastă: Da sau Nu.");
    state.roundPlayerIndex=idx+1;
    renderCurrentRoundPlayer();
    // Revenir réellement en haut du panneau du joueur suivant
    requestAnimationFrame(()=>{
      const panel=$("roundPlayersInputs").querySelector(".player-round");
      if(panel){
        const y=panel.getBoundingClientRect().top+window.pageYOffset-24;
        window.scrollTo({top:Math.max(0,y),behavior:"smooth"});
      }
    });
  };
}

    let no=state.rounds.length-j;
    return `<div class="history-item"><div class="history-head"><strong>#${no}</strong><div>${state.players.map(p=>`${esc(p.name)} ${r.scores[p.id]>=0?"+":""}${fmt(r.scores[p.id])}`).join(" · ")}</div><button class="history-toggle" data-history="${no}">${T().roundDetail}</button></div>
    <div class="history-detail hidden" id="detail-${no}">
      ${state.players.map(p=>{
        let d=r.detail?.[p.id]||{},canCount=(d.canastaNormal||0)+(d.canastaAce||0)+(d.canastaWildNormal||0)+(d.canastaWildAce||0)+(d.canasta3||0)+(d.canastaValues||0)+customRules().filter(x=>x.can).reduce((n,x)=>n+(d[x.key]||0),0);
        return `<div><strong>${esc(p.name)}</strong> — ${fr?"Canastas":"Canaste"}: ${canCount} · ${T().free}: ${d.free||0} · ${fr?"Score":"Scor"}: ${r.scores[p.id]>=0?"+":""}${fmt(r.scores[p.id])}</div>
        <div>${d.canasta3?`${esc(T().can3)} : ${d.canasta3} × +${fmt(state.rules.canasta3)}`:""}${d.canastaValues?`${d.canasta3?" · ":""}${esc(T().canValues)} : ${d.canastaValues} × +${fmt(state.rules.canastaValues)}`:""}${customRules().filter(x=>d[x.key]).map(x=>`${d.canasta3||d.canastaValues?" · ":""}${esc(x.label)} : ${d[x.key]} × ${x.pts>0?"+":""}${fmt(x.pts)}`).join("")}</div>`;
      }).join("")}
      <div>${fr?"Ferme":"Închide"} : ${esc(state.players[r.closer]?.name||"")}</div>
      <div>${T().turned} : ${esc(r.turned?.value||"—")} ${esc(r.turned?.suit||"")} ${r.turned?.double?"· ×2":""}</div>
    </div></div>`;
  }).join("");
}
function checkWinner(){
  let w=state.players.filter(p=>p.total>=10000).sort((a,b)=>b.total-a.total)[0];
  if(!w)return;
  if(!state.endDate)state.endDate=new Date().toISOString();
  state.finished=true;
  upsertGame(state);
  db.current=null;
  save();
  $("winnerName").textContent=w.name;$("winnerText").textContent=mode==="FR"?"Tu viens d’atteindre 10 000 points 🎉":"Ai atins 10.000 de puncte 🎉";$("winnerFun").textContent=FUN[mode][Math.floor(Math.random()*FUN[mode].length)];$("winnerModal").classList.remove("hidden")}
$("winnerNewGame").onclick=()=>{$("winnerModal").classList.add("hidden");state=null;db.current=null;save();show("home");renderResume();renderArchive()};
function openRules(){editRules={...state.rules};$("rulesTitle").textContent=T().rulesTitle;$("rulesIntro").textContent=T().rulesIntro;$("closeRules").textContent=T().home;$("saveRules").textContent=T().save;$("resetRules").textContent=T().reset;drawRules();show("rules")}
function drawRules(){ensureCanastaCustomRules();let fr=mode==="FR",names=fr?{canastaNormal:"Canasta 4 → Roi",canastaAce:"Canasta d’As",canastaWildNormal:"Canasta Valeurs 4 → Roi",canastaWildAce:"Canasta Valeurs d’As",canasta3:"Canasta de 3",canastaValues:"Canasta de valeurs",red3:"3 rouge",turned:"Carte retournée",close:"Fermeture"}:{canastaNormal:"Canasta 4 → Rege",canastaAce:"Canasta de Ași",canastaWildNormal:"Canasta de valori 4 → Rege",canastaWildAce:"Canasta de valori de Ași",canasta3:"Canasta de 3",canastaValues:"Canasta de valori",red3:"3 roșu",turned:"Carte întoarsă",close:"Închidere"};let o=Object.keys(editRules).map(k=>`<div class="admin"><label>${esc(names[k]||k)}</label><input type="number" data-r="${esc(k)}" value="${editRules[k]}"><button class="danger" data-d="${esc(k)}">${T().delete}</button></div>`).join("");o+=`<button class="secondary" id="addRule">+ ${fr?"Ajouter une règle":"Adaugă o regulă"}</button>`;$("ruleEditor").innerHTML=o;document.querySelectorAll("[data-r]").forEach(x=>x.oninput=()=>editRules[x.dataset.r]=parseInt(x.value||0,10)||0);document.querySelectorAll("[data-d]").forEach(x=>x.onclick=()=>{delete editRules[x.dataset.d];drawRules()});$("addRule").onclick=()=>{let n=prompt(fr?"Nom de la règle :":"Numele regulii:");if(!n)return;let v=parseInt(prompt(fr?"Valeur en points :":"Valoare în puncte:"),10);editRules[n]=Number.isFinite(v)?v:0;drawRules()}}
$("history").onclick=e=>{let b=e.target.closest("[data-history]");if(!b)return;let d=$("detail-"+b.dataset.history);d.classList.toggle("hidden");b.textContent=d.classList.contains("hidden")?T().roundDetail:T().hideDetail};
$("rulesBtn").onclick=openRules;$("closeRules").onclick=()=>show("game");$("saveRules").onclick=()=>{db.rules[mode]={...editRules};state.rules={...editRules};db.current=state;save();show("game");renderGame()};$("resetRules").onclick=()=>{editRules={...DEF[mode]};drawRules()};
async function init(){   await loadFromSupabase();   apply();   renderArchive(); }  init();
</script></body></html>
